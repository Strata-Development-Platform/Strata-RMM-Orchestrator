apiVersion: v2
name: strata-rmm
description: Strata RMM Platform - Remote Monitoring & Management
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">= 1.27.0"

home: https://github.com/Strata-Development-Platform/Strata-RMM-Orchestrator

dependencies:
  - name: nats
    version: "1.2.10"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
  - name: timescaledb-single
    version: "0.14.0"
    repository: "https://charts.timescale.com"
    condition: timescaledb.enabled
  - name: grafana
    version: "8.8.6"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
