{{- if .Values.orchestrator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "strata-rmm.fullname" . }}
  labels:
    {{- include "strata-rmm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.orchestrator.service.type }}
  ports:
    - port: {{ .Values.orchestrator.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "strata-rmm.selectorLabels" . | nindent 4 }}
{{- end }}
