{{- if not .Values.timescaledb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "strata-rmm.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.postgresql.auth.password | default (randAlphaNum 32) | b64enc | quote }}
{{- end }}
