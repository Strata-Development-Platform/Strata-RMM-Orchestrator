version: "3.9"

services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]

  postgres:
    image: timescale/timescaledb:2.15-pg16
    environment:
      POSTGRES_DB: strata_rmm
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "strata", "-d", "strata_rmm"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      STRATA_RMM_NATS_URL: nats://nats:4222
      STRATA_RMM_TIMESCALE_DSN: postgres://strata:strata_dev@postgres:5432/strata_rmm?sslmode=disable
      STRATA_RMM_API_ADDR: :8080
      STORAGE_BACKEND: minio
      STORAGE_BUCKET: strata-recordings
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_USE_SSL: "false"
    command: ["orchestrator", "--nats-url", "nats://nats:4222", "--timescale-dsn", "postgres://strata:strata_dev@postgres:5432/strata_rmm?sslmode=disable", "--api-addr", ":8080", "--storage-backend", "minio", "--storage-bucket", "strata-recordings", "--storage-endpoint", "minio:9000"]

  agent:
    build: .
    depends_on:
      - nats
    environment:
      STRATA_RMM_NATS_URL: nats://nats:4222
    command: ["agent", "--tenant-id", "dev-tenant", "--enrollment-token", "dev-token", "--nats-url", "nats://nats:4222"]
    profiles:
      - agent

  grafana:
    image: grafana/grafana:11.1
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - orchestrator
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/datasources:/etc/grafana/provisioning/datasources
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards

volumes:
  pgdata:
  grafana_data:
  minio_data: