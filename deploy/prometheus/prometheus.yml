global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: strata-orchestrator
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/strata_metrics_token
    static_configs:
      - targets:
          - orchestrator:8080
