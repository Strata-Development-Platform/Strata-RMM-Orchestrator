# Strata RMM Agent Configuration
# See strata-rmm agent --help for all flags

agent:
  tenant_id: ""                  # Required: set via CLI or env
  enrollment_token: ""           # Required for initial enrollment
  log_level: info                # debug, info, warn, error
  data_dir: ~/.strata-rmm        # Agent data directory
  tags:                          # Optional tags for this agent
    environment: production
    location: datacenter-1

nats:
  urls:
    - nats://localhost:4222
  reconnect_wait: 5s
  max_reconnects: -1             # -1 = unlimited

collect:
  interval: 60s                  # Collection interval
  enable_system: true
  enable_hardware: true
  enable_software: true
  enable_network: true
  enable_services: true

store:
  type: bbolt
  path: ~/.strata-rmm/agent.db   # Local persistence path

update:
  enabled: true
  check_interval: 24h
  channel: stable
