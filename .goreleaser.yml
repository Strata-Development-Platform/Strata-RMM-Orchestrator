version: 2

project_name: strata-rmm

before:
  hooks:
    - go mod tidy
    - sh scripts/build-cosign-verifier.sh

builds:
  - id: agent
    binary: strata-agent
    main: .
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]

  - id: orchestrator
    binary: strata-orchestrator
    main: .
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]

  - id: probe
    binary: strata-probe
    main: .
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]

archives:
  - id: agent
    ids: [agent]
    name_template: "{{ .ProjectName }}-agent-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, README.md]

  # The in-app/CLI updater consumes this raw, checksum-verified executable.
  - id: orchestrator
    ids: [orchestrator]
    name_template: "{{ .ProjectName }}-orchestrator-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [binary]

  - id: probe
    ids: [probe]
    name_template: "{{ .ProjectName }}-probe-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, README.md]

nfpms:
  - id: orchestrator-packages
    package_name: strata-rmm-orchestrator
    ids: [orchestrator]
    vendor: Strata Development Platform
    homepage: https://github.com/Strata-Development-Platform/Strata-RMM-Orchestrator
    maintainer: Strata Development Platform
    description: Strata RMM orchestration and management server
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/local/bin
    dependencies:
      - curl
    overrides:
      deb:
        dependencies:
          - curl
          - postgresql-client
      rpm:
        dependencies:
          - curl
          - postgresql
    scripts:
      postinstall: scripts/package-postinstall-orchestrator.sh
    contents:
      - src: deploy/strata-rmm.service
        dst: /usr/lib/systemd/system/strata-rmm.service
      - src: ui/dist
        dst: /usr/share/strata-rmm/ui
      - src: build/cosign-verifier/cosign
        dst: /usr/local/bin/cosign
        file_info:
          mode: 0755
      - src: build/cosign-verifier/BUILD-PROVENANCE.txt
        dst: /usr/share/strata-rmm/cosign-verifier-provenance.txt
        file_info:
          mode: 0644
      - src: scripts/finalize-orchestrator-upgrade.sh
        dst: /usr/lib/strata-rmm/finalize-orchestrator-upgrade.sh
        file_info:
          mode: 0755

  - id: agent-packages
    package_name: strata-rmm-agent
    ids: [agent]
    vendor: Strata Development Platform
    homepage: https://github.com/Strata-Development-Platform/Strata-RMM-Orchestrator
    maintainer: Strata Development Platform
    description: Strata RMM endpoint monitoring agent
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/local/bin
    contents:
      - src: deploy/strata-rmm-agent-package.service
        dst: /usr/lib/systemd/system/strata-rmm-agent.service

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "0.0.0-next"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

# Cosign v3 keyless bundles keep signature, certificate and transparency-log
# material together. Every checksum-listed release artifact gets its own bundle.
signs:
  - cmd: cosign
    artifacts: all
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}-{{ .Version }}-spdx.json"

release:
  github:
    owner: Strata-Development-Platform
    name: Strata-RMM-Orchestrator
  prerelease: auto
  name_template: "v{{ .Version }}"
