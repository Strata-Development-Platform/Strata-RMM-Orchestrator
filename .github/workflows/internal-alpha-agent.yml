name: Internal Alpha Agent

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-alpha-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authoritative-install-contract:
    name: Authoritative install and configured object storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Generate the clean-install configuration
        run: |
          set -euo pipefail
          password_file="$(mktemp)"
          trap 'rm -f "$password_file"; sudo docker compose --env-file deploy/docker/.install.env -f deploy/docker/docker-compose.install.yml down --volumes 2>/dev/null || true; sudo rm -rf deploy/docker/secrets deploy/docker/.install.env' EXIT
          printf '%s' 'ci-only-internal-alpha-password' > "$password_file"
          chmod 0600 "$password_file"
          sudo env STRATA_BOOTSTRAP_PASSWORD_FILE="$password_file" bash ./scripts/install-platform.sh \
            --mode docker --domain alpha.example.test --admin-email owner@example.test --prepare-only
          [ "$(sudo stat -c '%a' deploy/docker/secrets/storage_secret_key)" = 600 ]
          sudo grep -q 'STORAGE_BACKEND: minio' deploy/docker/docker-compose.install.yml
          sudo grep -q '/health/ready' deploy/docker/docker-compose.install.yml
      - name: Start and probe isolated configured object storage
        run: |
          set -euo pipefail
          password_file="$(mktemp)"
          trap 'rm -f "$password_file"; sudo docker compose --env-file deploy/docker/.install.env -f deploy/docker/docker-compose.install.yml down --volumes 2>/dev/null || true; sudo rm -rf deploy/docker/secrets deploy/docker/.install.env' EXIT
          printf '%s' 'ci-only-internal-alpha-password' > "$password_file"
          chmod 0600 "$password_file"
          sudo env STRATA_BOOTSTRAP_PASSWORD_FILE="$password_file" bash ./scripts/install-platform.sh \
            --mode docker --domain alpha.example.test --admin-email owner@example.test --prepare-only
          compose=(sudo docker compose --env-file deploy/docker/.install.env -f deploy/docker/docker-compose.install.yml)
          "${compose[@]}" up -d minio
          for attempt in $(seq 1 30); do
            status="$("${compose[@]}" ps --format json minio | jq -r '.Health // empty')"
            [ "$status" = healthy ] && break
            sleep 2
          done
          [ "${status:-}" = healthy ]
          "${compose[@]}" exec -T minio curl --fail --silent http://127.0.0.1:9000/minio/health/live
      - name: Verify file-backed storage configuration
        run: go test -race -count=1 ./pkg/config -run '^TestLoadStorageCredentialsFromFiles$'

  enrollment-and-policy:
    name: Enrollment and broker policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Enrollment, identity, and scoped authorization
        run: |
          go test -race -count=1 ./internal/agent/core
          go test -race -count=1 ./internal/platform -run 'Test(DecodeAgentPublicKey|BuildAgentNATSPermissions|AuthorizeAgentNATSCredential|Release)'

  telemetry-contract:
    name: Telemetry wire and replay contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Validate collector, queue, wire, and ingestion identity
        run: |
          go test -race -count=1 ./cmd/agent ./internal/agent/comms ./internal/monitoring

  nats-replay-integration:
    name: NATS outage queue and replay integration
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Replay queued telemetry through a live NATS server
        env:
          NATS_INTEGRATION_URL: nats://127.0.0.1:4222
        run: go test -race -count=1 ./internal/agent/comms -run '^TestReplayQueuedTelemetryAgainstNATS$'

  installer-and-release:
    name: Installer and release packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Validate installer safety contract
        run: |
          sh -n internal/platform/agent_install_linux.sh
          grep -q -- '--proto "$CURL_PROTO"' internal/platform/agent_install_linux.sh
          grep -q 'sha256sum --check' internal/platform/agent_install_linux.sh
          ! grep -Eq 'systemctl start .*\|\| true|reboot($|[[:space:]])' internal/platform/agent_install_linux.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw internal/platform/agent_install_windows.ps1))'
          grep -q 'Get-FileHash -Algorithm SHA256' internal/platform/agent_install_windows.ps1
          grep -q '?checksum=sha256' internal/platform/agent_install_linux.sh
          grep -q '?checksum=sha256' internal/platform/agent_install_windows.ps1
          ! grep -Eq 'ExecutionPolicy Bypass|SkipCertificateCheck' internal/platform/agent_install_windows.ps1
      - name: Build Linux release candidates
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/strata-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/strata-agent-linux-arm64 .
          test -s dist/strata-agent-linux-amd64
          test -s dist/strata-agent-linux-arm64

  cross-platform-agent:
    name: Agent build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build agent command
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/strata-agent .
