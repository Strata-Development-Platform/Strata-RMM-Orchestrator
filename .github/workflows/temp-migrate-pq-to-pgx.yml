name: Temporary migrate libpq to pgx

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alpha-patch-transaction-safety
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Migrate database/sql driver registration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p internal/postgresdriver
          cat > internal/postgresdriver/driver.go <<'EOF'
          // Package postgresdriver registers pgx's database/sql adapter under the
          // historical "postgres" driver name used throughout Strata RMM. Keeping
          // the name stable lets the application migrate away from lib/pq without
          // changing connection construction at every call site.
          package postgresdriver

          import (
          	"database/sql"

          	"github.com/jackc/pgx/v5/stdlib"
          )

          func init() {
          	sql.Register("postgres", stdlib.GetDefaultDriver())
          }
          EOF

          # Replace blank driver imports with the internal pgx registration shim.
          while IFS= read -r -d '' file; do
            sed -i 's#_ "github.com/lib/pq"#_ "github.com/strata-rmm/strata-rmm-orchestrator/internal/postgresdriver"#g' "$file"
          done < <(find . -name '*.go' -type f -print0)

          # Replace lib/pq array adapters with native pgx database/sql values.
          sed -i '/^[[:space:]]*"github.com\/lib\/pq"[[:space:]]*$/d' internal/platform/authorize.go
          sed -i 's/pq\.Array(unique)/unique/g' internal/platform/authorize.go

          sed -i '/^[[:space:]]*"github.com\/lib\/pq"[[:space:]]*$/d' internal/platform/support_handlers.go
          sed -i 's/pq\.Array(req\.Permissions)/req.Permissions/g' internal/platform/support_handlers.go

          sed -i '/^[[:space:]]*"github.com\/lib\/pq"[[:space:]]*$/d' internal/platform/smart_group_handlers.go
          sed -i 's/var memberIDs pq\.StringArray/var memberIDs []string/g' internal/platform/smart_group_handlers.go
          sed -i 's/memberIDs = pq\.StringArray(req\.DeviceIDs)/memberIDs = req.DeviceIDs/g' internal/platform/smart_group_handlers.go
          sed -i 's/memberIDs = pq\.StringArray{}/memberIDs = []string{}/g' internal/platform/smart_group_handlers.go
          sed -i 's/pq\.StringArray(req\.DeviceIDs)/req.DeviceIDs/g' internal/platform/smart_group_handlers.go

          sed -i '/^[[:space:]]*"github.com\/lib\/pq"[[:space:]]*$/d' internal/platform/maintenance_handlers.go
          sed -i 's/pq\.StringArray(req\.DeviceIDs)/req.DeviceIDs/g' internal/platform/maintenance_handlers.go

          sed -i '/^[[:space:]]*"github.com\/lib\/pq"[[:space:]]*$/d' internal/patch/canary_control.go
          sed -i 's/pq\.Array(canary)/canary/g' internal/patch/canary_control.go
          sed -i 's/pq\.Array(devices)/devices/g' internal/patch/canary_control.go

          # Translate retryable PostgreSQL errors from lib/pq to pgx/pgconn.
          sed -i 's#"github.com/lib/pq"#"github.com/jackc/pgx/v5/pgconn"#g' internal/platform/result_retry.go
          sed -i 's/var pqErr \*pq\.Error/var pgErr *pgconn.PgError/g' internal/platform/result_retry.go
          sed -i 's/errors\.As(err, \&pqErr)/errors.As(err, \&pgErr)/g' internal/platform/result_retry.go
          sed -i 's/pqErr\.Code/pgErr.Code/g' internal/platform/result_retry.go

          sed -i 's#"github.com/lib/pq"#"github.com/jackc/pgx/v5/pgconn"#g' internal/platform/module_lifecycle_api.go
          sed -i 's/var pqErr \*pq\.Error/var pgErr *pgconn.PgError/g' internal/platform/module_lifecycle_api.go
          sed -i 's/errors\.As(err, \&pqErr)/errors.As(err, \&pgErr)/g' internal/platform/module_lifecycle_api.go
          sed -i 's/pqErr\.Code/pgErr.Code/g' internal/platform/module_lifecycle_api.go

          if grep -R --line-number --include='*.go' 'github.com/lib/pq' . > /tmp/pq-remaining.txt; then
            echo 'Unmigrated lib/pq imports remain:'
            cat /tmp/pq-remaining.txt
            printf 'Unmigrated lib/pq imports remain:\n\n```text\n' > /tmp/report.md
            cat /tmp/pq-remaining.txt >> /tmp/report.md
            printf '\n```\n' >> /tmp/report.md
            gh pr comment 153 --body-file /tmp/report.md || true
            exit 1
          fi
          if grep -R --line-number --include='*.go' -E '\bpq\.' . > /tmp/pq-api-remaining.txt; then
            echo 'Unmigrated pq-specific API usage remains:'
            cat /tmp/pq-api-remaining.txt
            printf 'Unmigrated pq-specific API usage remains:\n\n```text\n' > /tmp/report.md
            cat /tmp/pq-api-remaining.txt >> /tmp/report.md
            printf '\n```\n' >> /tmp/report.md
            gh pr comment 153 --body-file /tmp/report.md || true
            exit 1
          fi

          go mod edit -droprequire github.com/lib/pq
          go get github.com/jackc/pgx/v5/stdlib@v5.10.0
          go mod tidy
          gofmt -w \
            internal/postgresdriver/driver.go \
            internal/platform/authorize.go \
            internal/platform/support_handlers.go \
            internal/platform/result_retry.go \
            internal/platform/smart_group_handlers.go \
            internal/platform/module_lifecycle_api.go \
            internal/platform/maintenance_handlers.go \
            internal/patch/canary_control.go \
            pkg/backup/postgres_component.go \
            pkg/timescale/writer.go

          go test ./internal/platform ./pkg/backup ./pkg/timescale ./pkg/postgres ./internal/patch ./internal/inventory
          go vet ./internal/platform ./pkg/backup ./pkg/timescale ./pkg/postgres ./internal/patch ./internal/inventory

      - name: Commit generated migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-migrate-pq-to-pgx.yml
          git add go.mod go.sum internal pkg
          git diff --cached --check
          git commit -m 'security: migrate PostgreSQL driver from libpq to pgx'
          git push origin HEAD:agent/alpha-patch-transaction-safety
