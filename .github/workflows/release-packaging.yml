name: Release Packaging

on:
  pull_request:
    branches: [master]
    paths:
      - ".goreleaser.yml"
      - ".github/workflows/release-packaging.yml"
      - "Dockerfile"
      - "deploy/*.service"
      - "scripts/install-platform.sh"
      - "scripts/install-cosign-verifier.sh"
      - "scripts/build-cosign-verifier.sh"
      - "scripts/finalize-orchestrator-upgrade.sh"
      - "scripts/test-finalize-orchestrator-upgrade.sh"
      - "scripts/package-postinstall-orchestrator.sh"
      - "ui/**"
      - "internal/update/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-contract:
    name: Updater Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Test semantic version and checksum policy
        run: go test -count=1 -race ./internal/update

  snapshot-packages:
    name: Snapshot Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Validate verifier and finalizer scripts
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/build-cosign-verifier.sh
          sh -n scripts/finalize-orchestrator-upgrade.sh
          sh -n scripts/test-finalize-orchestrator-upgrade.sh
          sh -n scripts/package-postinstall-orchestrator.sh
          grep -q 'COSIGN_COMMIT="11926fa5bbbbde47e88fc006b625a17769b743b2"' scripts/build-cosign-verifier.sh
          grep -q 'X_TEXT_VERSION="v0.39.0"' scripts/build-cosign-verifier.sh
          grep -q 'GRPC_VERSION="v1.82.1"' scripts/build-cosign-verifier.sh
          grep -q 'systemctl stop' scripts/finalize-orchestrator-upgrade.sh
          grep -q 'mv "$BINARY_PATH" "$BACKUP_PATH"' scripts/finalize-orchestrator-upgrade.sh
          grep -q 'mv "$STAGED_PATH" "$BINARY_PATH"' scripts/finalize-orchestrator-upgrade.sh
          grep -q 'pg_restore' scripts/finalize-orchestrator-upgrade.sh
          grep -q 'sha256sum "$DB_BACKUP_PATH"' scripts/finalize-orchestrator-upgrade.sh
          grep -q 'mv "$BACKUP_PATH" "$BINARY_PATH"' scripts/finalize-orchestrator-upgrade.sh
          sh scripts/test-finalize-orchestrator-upgrade.sh
      - name: Build version-matched web console
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: Build unsigned snapshot packages
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign,sbom
      - name: Verify immutable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/checksums.txt

          verify_manifest_entry() {
            local file="$1"
            local artifact_name="${2:-$(basename "$file")}"
            local expected actual
            expected="$(awk -v name="$artifact_name" '$2 == name || $2 == "*" name {print $1}' dist/checksums.txt)"
            test -n "$expected"
            actual="$(sha256sum "$file" | awk '{print $1}')"
            test "$actual" = "$expected"
          }

          verify_manifest_entry \
            dist/orchestrator_linux_amd64_v1/strata-orchestrator \
            strata-rmm-orchestrator-0.0.0-next-linux-amd64

          for pattern in \
            'dist/strata-rmm-orchestrator_*.deb' \
            'dist/strata-rmm-orchestrator_*.rpm' \
            'dist/strata-rmm-agent_*.deb' \
            'dist/strata-rmm-agent_*.rpm'; do
            compgen -G "$pattern" >/dev/null
            for package in $pattern; do
              verify_manifest_entry "$package"
            done
          done

          for package in dist/strata-rmm-orchestrator_*.deb; do
            contents_file="$(mktemp)"
            control_dir="$(mktemp -d)"
            trap 'rm -f "$contents_file"; rm -rf "$control_dir"' RETURN
            dpkg-deb --contents "$package" > "$contents_file"
            grep -q './usr/share/strata-rmm/ui/index.html' "$contents_file"
            grep -q './usr/local/bin/cosign' "$contents_file"
            grep -q './usr/share/strata-rmm/cosign-verifier-provenance.txt' "$contents_file"
            grep -q './usr/lib/strata-rmm/finalize-orchestrator-upgrade.sh' "$contents_file"
            dpkg-deb --control "$package" "$control_dir"
            test -s "$control_dir/postinst"
            grep -q '/usr/local/bin/cosign' "$control_dir/postinst"
            grep -q '/usr/lib/strata-rmm/finalize-orchestrator-upgrade.sh' "$control_dir/postinst"
            grep -q 'Depends:.*curl' "$control_dir/control"
            grep -q 'Depends:.*postgresql-client' "$control_dir/control"
            if grep -q 'install-cosign-verifier.sh' "$contents_file" "$control_dir/postinst"; then
              echo 'legacy network Cosign bootstrap must not be packaged' >&2
              exit 1
            fi
            rm -f "$contents_file"
            rm -rf "$control_dir"
            trap - RETURN
          done
      - name: Upload snapshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: versioned-snapshot-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7
