name: Release Packaging

on:
  pull_request:
    branches: [master]
    paths:
      - ".goreleaser.yml"
      - ".github/workflows/release-packaging.yml"
      - "deploy/*.service"
      - "scripts/install-platform.sh"
      - "ui/**"
      - "internal/update/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-contract:
    name: Updater Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test semantic version and checksum policy
        run: go test -count=1 -race ./internal/update

  snapshot-packages:
    name: Snapshot Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build version-matched web console
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: Build unsigned snapshot packages
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign,sbom
      - name: Verify immutable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/checksums.txt

          verify_manifest_entry() {
            local file="$1"
            local artifact_name="${2:-$(basename "$file")}"
            local expected actual
            expected="$(awk -v name="$artifact_name" '$2 == name || $2 == "*" name {print $1}' dist/checksums.txt)"
            test -n "$expected"
            actual="$(sha256sum "$file" | awk '{print $1}')"
            test "$actual" = "$expected"
          }

          verify_manifest_entry             dist/orchestrator_linux_amd64_v1/strata-orchestrator             strata-rmm-orchestrator-0.0.0-next-linux-amd64

          for pattern in             'dist/strata-rmm-orchestrator_*.deb'             'dist/strata-rmm-orchestrator_*.rpm'             'dist/strata-rmm-agent_*.deb'             'dist/strata-rmm-agent_*.rpm'; do
            compgen -G "$pattern" >/dev/null
            for package in $pattern; do
              verify_manifest_entry "$package"
            done
          done
          dpkg-deb --contents dist/strata-rmm-orchestrator_*.deb | grep -q './usr/share/strata-rmm/ui/index.html'
      - name: Upload snapshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: versioned-snapshot-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7
