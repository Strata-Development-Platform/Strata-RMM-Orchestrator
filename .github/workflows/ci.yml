  phase8b-deployment-template-rendering:
    name: Phase 8B — Deployment Template Rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Resolve pinned Helm dependencies
        run: helm dependency build deploy/helm/strata-rmm/
      - name: Validate Helm chart linting
        run: |
          helm lint deploy/helm/strata-rmm/
      - name: Validate Helm chart rendering
        run: |
          helm template strata-rmm deploy/helm/strata-rmm/ > /tmp/strata-rmm-rendered.yaml
          test -s /tmp/strata-rmm-rendered.yaml
      - name: Validate docker-compose syntax
        env:
          JWT_SECRET: ci-only-compose-render-secret-000000000000
          STRATA_METRICS_TOKEN: ci-only-metrics-render-secret-000000000
          STRATA_METRICS_TOKEN_FILE: /tmp/strata-metrics-token
          POSTGRES_PASSWORD: ci-compose-postgres
          MINIO_ROOT_PASSWORD: ci-compose-object-storage
          GRAFANA_ADMIN_PASSWORD: ci-compose-grafana
        run: |
          printf '%s' "$STRATA_METRICS_TOKEN" > "$STRATA_METRICS_TOKEN_FILE"
          docker compose -f deploy/docker/docker-compose.yml config --quiet
      - name: Validate Kots application manifest
        run: |
          python3 -c "import yaml; yaml.safe_load(open('deploy/kots/application.yaml'))"
      - name: Verify deployment config files are valid YAML
        run: |
          for f in deploy/kots/config.yaml deploy/grafana/datasources/datasources.yaml deploy/grafana/dashboards/dashboard-provider.yaml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "OK: $f"
          done
      - name: Verify systemd unit file exists and is valid
        run: |
          test -f deploy/strata-rmm-agent.service
          sed 's#ExecStart=/usr/local/bin/strata-rmm.*#ExecStart=/bin/true#' deploy/strata-rmm-agent.service > /tmp/strata-rmm-agent.service
          systemd-analyze verify /tmp/strata-rmm-agent.service
      - name: Verify all deployment templates contain expected keys
        run: |
          python3 -c "import yaml; f=open('deploy/helm/strata-rmm/values.yaml'); v=yaml.safe_load(f); assert 'replicaCount' in v; assert 'image' in v; assert 'service' in v; print('OK: Helm values.yaml valid')"
          python3 -c "import yaml; yaml.safe_load(open('deploy/kots/config.yaml')); print('OK: Kots config.yaml valid')"
      - name: Verify deployment docs reference correct templates
        run: |
          for f in docs/DEPLOYMENT.md docs/UPGRADE.md docs/ROLLBACK.md; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(wc -l < "$f") lines)"
              grep -l "helm\|docker-compose\|systemd\|kots" "$f" > /dev/null 2>&1 && echo "  -> contains deployment template references"
            fi
          done
