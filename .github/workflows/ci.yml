name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.2
          args: --timeout=5m
          only-new-issues: true

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test ./... -count=1 -race -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out

  database-isolation:
    name: Database Isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_DB: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test -tags=dbintegration ./pkg/postgres -count=1 -v

  saas-control-plane:
    name: SaaS Control Plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_DB: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Verify SaaS authorization and entitlement isolation
        run: |
          set -o pipefail
          go test ./internal/platform -count=1 -race
          go test -tags=dbintegration ./pkg/postgres -count=1 -race -run TestTenantRLSMigration -v
          go test -tags=dbintegration ./internal/platform -count=1 -race -run TestScopedMembershipReplacementPreservesUnmanagedAndSerializes -v

  durable-jobs-integration:
    name: Durable Jobs Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_DB: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      nats:
        image: nats:2.11-alpine
        ports:
          - 4222:4222
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
      TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Exercise durable job protocol
        run: go test -tags=jobintegration -p=1 ./internal/agent/jobs ./internal/platform -count=1 -race -v

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          go build -ldflags="-s -w -X main.version=${{ github.sha }} -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%d)" \
          -o strata-rmm-${{ matrix.os }}-${{ matrix.arch }} .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: strata-rmm-${{ matrix.os }}-${{ matrix.arch }}
          path: strata-rmm-${{ matrix.os }}-${{ matrix.arch }}

  phase8b-static-validation:
    name: Phase 8B — Static Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts with shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          severity: error
      - name: Validate systemd unit files
        run: |
          if command -v systemd-analyze &>/dev/null; then
            systemd-analyze verify deploy/*.service 2>/dev/null || echo "systemd-analyze warnings (non-fatal)"
          fi
      - name: Validate YAML syntax
        run: python3 scripts/validate_yaml.py
      - name: Validate Docker Compose file
        run: |
          python3 -c "import yaml; yaml.safe_load(open('deploy/docker/docker-compose.yml'))"

  phase8b-docs-check:
    name: Phase 8B — Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment documentation exists
        run: |
          for f in docs/DEPLOYMENT.md docs/UPGRADE.md docs/ROLLBACK.md; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required doc: $f"
              exit 1
            fi
            echo "OK: $f ($(wc -l < "$f") lines)"
          done
      - name: Verify deployment docs contain no placeholder references
        run: |
          for f in docs/DEPLOYMENT.md docs/UPGRADE.md docs/ROLLBACK.md; do
            if grep -qi "validate-config\|check-migrations\|dry-run-migrations\|schema_migrations_lock" "$f"; then
              echo "ERROR: $f contains placeholder references"
              exit 1
            fi
          done
          echo "All docs clean"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx tsc -b
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui

  endpoint-operations:
    name: Endpoint Operations Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: strata_test
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      nats:
        image: nats:2.11-alpine
        ports:
          - 4222:4222
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
      TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Verify endpoint operation handlers
        run: go test ./internal/agent/jobs ./internal/platform -count=1 -race -v

  phase7-approval:
    name: Phase 7 — Approval Workflow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: strata_test
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test approval workflow
        run: |
          set -o pipefail
          go test -tags=dbintegration ./internal/platform -count=1 -race -v -run "TestApproval" 2>&1 | tee /tmp/approval_test.log
          grep -E '^--- (PASS|FAIL)' /tmp/approval_test.log
          if grep -q "no test files\|no tests to run" /tmp/approval_test.log; then echo "ERROR: zero tests executed" && exit 1; fi

  phase7-destructive-idempotency:
    name: Phase 7 — Destructive Idempotency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: strata_test
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      nats:
        image: nats:2.11-alpine
        ports:
          - 4222:4222
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
      TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Prove duplicate destructive execution prevention
        run: |
          set -o pipefail
          go test -tags=jobintegration ./internal/agent/jobs -count=1 -race -v -run "TestReceiptLedgerRejectsDuplicateWithoutOverwrite|TestRunningCommandCancellationProducesTerminalResult|TestResultReplaysAfterAgentRestartUntilReceipt" 2>&1 | tee /tmp/idempotency_test.log
          grep -E '^--- (PASS|FAIL)' /tmp/idempotency_test.log
          if grep -q "no test files\|no tests to run" /tmp/idempotency_test.log; then echo "ERROR: zero tests executed" && exit 1; fi

  phase7-maintenance-offline:
    name: Phase 7 — Maintenance & Offline Lifecycle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: strata_test
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test maintenance window and offline lifecycle
        run: |
          set -o pipefail
          go test -tags=dbintegration ./internal/platform -count=1 -race -v -run "TestMaintenanceWindowEnforcement" 2>&1 | tee /tmp/maint_test.log
          grep -E '^--- (PASS|FAIL)' /tmp/maint_test.log
          if grep -q "no test files\|no tests to run" /tmp/maint_test.log; then echo "ERROR: zero tests executed" && exit 1; fi

  phase7-audit:
    name: Phase 7 — Immutable Audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: strata_test
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test immutable audit protections
        run: |
          set -o pipefail
          go test -tags=dbintegration ./internal/platform -count=1 -race -v -run "TestAuditEvidenceIsAppendOnly|TestAuditEvidenceCrossMSPReadDenied|TestAuditEvidenceTransactionRollbackRemovesEvidence" 2>&1 | tee /tmp/audit_test.log
          grep -E '^--- (PASS|FAIL)' /tmp/audit_test.log
          if grep -q "no test files\|no tests to run" /tmp/audit_test.log; then echo "ERROR: zero tests executed" && exit 1; fi

  phase7-capabilities:
    name: Phase 7 — Capability Negotiation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test capability negotiation
        run: |
          set -o pipefail
          go test ./internal/platform -count=1 -race -v -run "TestIsActionSupportedByCapabilities|TestCapability" 2>&1 | tee /tmp/cap_test.log
          grep -E '^--- (PASS|FAIL)' /tmp/cap_test.log
          if grep -q "no test files\|no tests to run" /tmp/cap_test.log; then echo "ERROR: zero tests executed" && exit 1; fi

  phase7-inventory:
    name: Phase 7 — Inventory Ingestion
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: strata_test
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test inventory result ingestion
        run: |
          set -o pipefail
          go test -tags=dbintegration ./internal/platform -count=1 -race -v -run "TestInventoryResultIdempotency|TestInventoryStaleResultRejected|TestInventoryCrossDeviceRejected" 2>&1 | tee /tmp/inv_test.log
          grep -E '^--- (PASS|FAIL)' /tmp/inv_test.log
          if grep -q "no test files\|no tests to run" /tmp/inv_test.log; then echo "ERROR: zero tests executed" && exit 1; fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: -severity high ./...
      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown


  phase7-browser-acceptance:
    name: Phase 7 — Browser Acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci
      - name: Install pinned browser test runner
        working-directory: ui
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Run Phase 7 browser acceptance
        working-directory: ui
        run: npx playwright test
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-browser-evidence
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
          retention-days: 14

  phase-8b-runtime:
    name: Phase 8B — Runtime Validation
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_DB: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Validate migration lock
        run: go test ./pkg/postgres -short -count=1 -race -run "TestMigrationLockAcquisitionSucceeds|TestSchemaLock_AcquireTimeout|TestMigrationLockSecondConcurrentFails" -v
      - name: Validate upgrade manager
        run: go test ./pkg/postgres -short -count=1 -race -run "TestRunUpgrade|TestValidateTarget|TestHookExecutionOrder|TestGetSchemaVersion" -v
      - name: Validate rollback engine
        run: go test ./pkg/postgres -short -count=1 -race -run "TestRunRollback|TestRunPhase|TestRollbackResult|TestNewRollbackEngine|TestSetDryRun" -v
      - name: Validate state preservation
        run: go test ./pkg/postgres -short -count=1 -race -run "TestNewStatePreserver|TestSaveSnapshot|TestLoadSnapshot|TestListSnapshots|TestDeleteSnapshot|TestCompareSnapshots|TestPreDeploySnapshot|TestPreRollbackSnapshot|TestRestoreSnapshot|TestSplitCSV|TestGenerateSnapshotID|TestSnapshotJSONRoundTrip|TestValidateSnapshotTableCountMismatch" -v
      - name: Validate deployment controller
        run: go test ./internal/platform -short -count=1 -race -run "TestDeploymentController|TestDeploymentState" -v

  phase8b-migration-lock-concurrency:
    name: Phase 8B — Migration Lock Concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_DB: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test migration lock concurrency and timeout
        run: |
          set -o pipefail
          go test -tags=dbintegration ./pkg/postgres -count=1 -race -v -run "TestMigrationLockAcquisitionSucceeds|TestMigrationLockSecondConcurrentFails|TestMigrationLockReleasedAfterSuccess|TestMigrationLockContextCancellation|TestMigrationLockFailureReleasesLock|TestMigrationLockSameConnectionUsed|TestSchemaLock_AcquireTimeout|TestSchemaLock_ReleaseError|TestSchemaLock_IdempotentApply|TestSchemaLock_AcquireContextCancellation|TestSchemaLock_VersionConflict|TestSchemaLock_ReleaseErrorPropagation" 2>&1 | tee /tmp/lock_test.log
          grep -E '^--- (PASS|FAIL)' /tmp/lock_test.log
          if grep -q "no test files\|no tests to run" /tmp/lock_test.log; then echo "ERROR: zero tests executed" && exit 1; fi

  phase8b-preflight-and-redaction:
    name: Phase 8B — Preflight and Redaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test preflight checks and credential redaction
        run: |
          set -o pipefail
          go test ./pkg/postgres -short -count=1 -race -v -run "TestRedactCredentials|TestPreflightCheck|TestPreflightResult|TestAdversarial|TestCheckCandidateArtifact|TestCheckSecretsPresent|TestCheckStorageWritable|TestCheckNATSConnectivity|TestCheckJetStreamAccess|TestCheckDiskSpace|TestCheckPostgresVersion|TestCheckActiveConnections|TestCheckSchemaVersion|TestComputeChecksumType|TestMaskChecksum|TestNewPreflightChecker|TestValidStatuses|TestCheckCandidateArtifact_ChecksumCaseInsensitive" 2>&1 | tee /tmp/preflight_test.log
          grep -E '^--- (PASS|FAIL)' /tmp/preflight_test.log
          if grep -q "no test files\|no tests to run" /tmp/preflight_test.log; then echo "ERROR: zero tests executed" && exit 1; fi

  phase8b-clean-deployment:
