        env:
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_DB: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test clean deployment upgrade lifecycle
        run: |
          set -o pipefail
          go test ./pkg/postgres -short -count=1 -race -v -run "TestRunUpgrade_Success|TestRunUpgrade_MissingHooks_UsesDefaults|TestRunUpgrade_ContextCancellation|TestRunUpgrade_ConcurrentPrevention|TestRunUpgrade_VersionStoreError|TestRunUpgrade_SetVersionError|TestRunUpgrade_LockError|TestValidateTarget|TestHookExecutionOrder|TestGetSchemaVersion_Caching" 2>&1 | tee /tmp/clean_deploy_test.log
          grep -E '^--- (PASS|FAIL)' /tmp/clean_deploy_test.log
          if grep -q "no test files\|no tests to run" /tmp/clean_deploy_test.log; then echo "ERROR: zero tests executed" && exit 1; fi

  phase8b-same-version-idempotency:
    name: Phase 8B — Same-Version Idempotency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_DB: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
