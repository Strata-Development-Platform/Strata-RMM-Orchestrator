name: Phase 8F — MSP Lifecycle and Unified Dashboards

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8f-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-and-ui:
    name: Static and UI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go formatting, vet, and build
        run: |
          test -z "$(gofmt -l \
            internal/platform/lifecycle_export.go \
            internal/platform/lifecycle_export_test.go \
            internal/platform/offboarding_handlers.go \
            internal/platform/offboarding_handlers_test.go \
            internal/platform/phase8f_integration_test.go \
            internal/platform/context_handler_test.go \
            internal/platform/control_plane_handlers.go \
            internal/platform/api.go \
            internal/platform/middleware.go \
            pkg/postgres/schema.go \
            pkg/postgres/backup_migration_test.go \
            pkg/backup/postgres_integration_test.go)"
          go vet ./internal/platform ./pkg/postgres
          go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Frontend typecheck, lint, and build
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

  lifecycle-integration:
    name: Offboarding and Export Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata_test
          POSTGRES_PASSWORD: strata_test
          POSTGRES_DB: strata_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata_test -d strata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://strata_test:strata_test@localhost:5432/strata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify atomic revocation, bounded export, redaction, and audit
        run: go test -tags=phase8fintegration ./internal/platform -run TestPhase8F -count=1 -race -v

  authorization-contract:
    name: Authorization and Input Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify platform-only routes and bounded inputs
        run: |
          go test ./internal/platform -count=1 -race -v \
            -run 'TestContextRouteClassification|TestNormalizeOffboardingRequest|TestLifecycleExportLimit'
