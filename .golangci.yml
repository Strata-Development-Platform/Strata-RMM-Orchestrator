version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

issues:
  exclude-rules:
    # Pre-existing: agent package unchecked errors (not Phase 8B)
    - path: ".*agent/.*"
      linters:
        - errcheck
    # Pre-existing: probe package unchecked errors
    - path: ".*probe/.*"
      linters:
        - errcheck
    # Pre-existing: monitoring package unused field
    - path: ".*monitoring/.*"
      linters:
        - unused
    # Pre-existing: inventory package unused var
    - path: ".*inventory/.*"
      linters:
        - unused
    # Pre-existing: remote package unused types
    - path: ".*remote/.*"
      linters:
        - unused
    # Pre-existing: platform middleware unused func
    - path: ".*middleware\\.go"
      linters:
        - unused
    # Pre-existing: timescale package unchecked rollback
    - path: ".*timescale/.*"
      linters:
        - errcheck
    # Pre-existing: update package unchecked errors
    - path: ".*update/.*"
      linters:
        - errcheck
    # Pre-existing: S3 storage deprecated API
    - path: ".*s3_backend\\.go"
      linters:
        - staticcheck
    # Pre-existing: agent core deprecated marshal
    - path: ".*identity\\.go"
      linters:
        - staticcheck
    # Pre-existing: agent core ineffectual assignment
    - path: ".*agent\\.go"
      linters:
        - ineffassign
    # Pre-existing: storage ineffectual assignment
    - path: ".*minio_backend\\.go"
      linters:
        - ineffassign
    # Pre-existing: platform gosimple issues (now part of staticcheck in v2)
    - path: ".*platform/.*"
      linters:
        - staticcheck
      text: "S1016|S1025|S1039"
