run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  exclude-rules:
    # Pre-existing: agent package unchecked errors (not Phase 8B)
    - path: internal/agent/
      source: $
      linters:
        - errcheck
    # Pre-existing: probe package unchecked errors
    - path: internal/probe/
      linters:
        - errcheck
    # Pre-existing: monitoring package unused field
    - path: internal/monitoring/
      linters:
        - unused
    # Pre-existing: inventory package unused var
    - path: internal/inventory/
      linters:
        - unused
    # Pre-existing: remote package unused types
    - path: internal/remote/
      linters:
        - unused
    # Pre-existing: platform middleware unused func
    - path: middleware\.go
      linters:
        - unused
    # Pre-existing: timescale package unchecked rollback
    - path: pkg/timescale/
      linters:
        - errcheck
    # Pre-existing: update package unchecked errors
    - path: internal/update/
      linters:
        - errcheck
    # Pre-existing: S3 storage deprecated API
    - path: pkg/storage/s3_backend\.go
      linters:
        - staticcheck
    # Pre-existing: agent core deprecated marshal
    - path: internal/agent/core/identity\.go
      linters:
        - staticcheck
    # Pre-existing: agent core ineffectual assignment
    - path: internal/agent/core/agent\.go
      linters:
        - ineffassign
    # Pre-existing: storage ineffectual assignment
    - path: pkg/storage/minio_backend\.go
      linters:
        - ineffassign
    # Pre-existing: platform gosimple issues
    - path: internal/platform/
      linters:
        - gosimple
      text: "S1016|S1025|S1039"
